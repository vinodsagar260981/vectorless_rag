<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vectorless RAG</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-zinc-950 text-zinc-100">
    <main class="mx-auto flex min-h-screen w-full max-w-6xl flex-col gap-6 px-4 py-6 sm:px-6 lg:px-8">
      <header class="flex flex-col gap-2 border-b border-zinc-800 pb-5">
        <p class="text-sm font-medium uppercase tracking-wider text-cyan-300">PageIndex</p>
        <h1 class="text-3xl font-semibold text-white sm:text-4xl">Vectorless RAG Console</h1>
        <p class="max-w-3xl text-sm leading-6 text-zinc-400">
          Load a PDF or reuse an existing PageIndex document ID, then ask questions using the FastAPI endpoints.
        </p>
      </header>

      <section class="grid gap-5 lg:grid-cols-[360px_1fr]">
        <aside class="rounded-lg border border-zinc-800 bg-zinc-900 p-5 shadow-xl shadow-black/20">
          <form id="loadForm" class="space-y-4">
            <div>
              <label for="pdfPath" class="block text-sm font-medium text-zinc-200">PDF path</label>
              <input
                id="pdfPath"
                name="pdfPath"
                value="./Detailed_Summary.pdf"
                class="mt-2 w-full rounded-md border border-zinc-700 bg-zinc-950 px-3 py-2 text-sm text-zinc-100 outline-none ring-cyan-400/30 focus:border-cyan-400 focus:ring-4"
              />
            </div>

            <div>
              <label for="docId" class="block text-sm font-medium text-zinc-200">Existing doc ID</label>
              <input
                id="docId"
                name="docId"
                placeholder="Optional"
                class="mt-2 w-full rounded-md border border-zinc-700 bg-zinc-950 px-3 py-2 text-sm text-zinc-100 outline-none ring-cyan-400/30 focus:border-cyan-400 focus:ring-4"
              />
            </div>

            <div>
              <label for="treeModel" class="block text-sm font-medium text-zinc-200">Tree-search model</label>
              <input
                id="treeModel"
                name="treeModel"
                value="openai/gpt-oss-120b"
                class="mt-2 w-full rounded-md border border-zinc-700 bg-zinc-950 px-3 py-2 text-sm text-zinc-100 outline-none ring-cyan-400/30 focus:border-cyan-400 focus:ring-4"
              />
            </div>

            <button
              id="loadButton"
              type="submit"
              class="w-full rounded-md bg-cyan-400 px-4 py-2.5 text-sm font-semibold text-zinc-950 transition hover:bg-cyan-300 disabled:cursor-not-allowed disabled:opacity-60"
            >
              Load document
            </button>
          </form>

          <div class="mt-5 rounded-md border border-zinc-800 bg-zinc-950 p-4">
            <h2 class="text-sm font-semibold text-zinc-100">Document status</h2>
            <dl class="mt-3 grid grid-cols-2 gap-3 text-sm">
              <dt class="text-zinc-500">Ready</dt>
              <dd id="readyValue" class="text-right text-zinc-200">No</dd>
              <dt class="text-zinc-500">Doc ID</dt>
              <dd id="docIdValue" class="truncate text-right text-zinc-200">-</dd>
              <dt class="text-zinc-500">Sections</dt>
              <dd id="sectionsValue" class="text-right text-zinc-200">0</dd>
              <dt class="text-zinc-500">Nodes</dt>
              <dd id="nodesValue" class="text-right text-zinc-200">0</dd>
            </dl>
          </div>
        </aside>

        <section class="flex min-h-[620px] flex-col rounded-lg border border-zinc-800 bg-zinc-900 shadow-xl shadow-black/20">
          <div id="messages" class="flex-1 space-y-4 overflow-y-auto p-5">
            <div class="rounded-lg border border-zinc-800 bg-zinc-950 p-4 text-sm leading-6 text-zinc-300">
              Load a document first, then ask a question. The answer will include citations from the retrieved sections.
            </div>
          </div>

          <form id="askForm" class="border-t border-zinc-800 p-4">
            <label for="query" class="sr-only">Question</label>
            <div class="flex flex-col gap-3 sm:flex-row">
              <input
                id="query"
                name="query"
                placeholder="Ask about the loaded document..."
                class="min-h-11 flex-1 rounded-md border border-zinc-700 bg-zinc-950 px-3 py-2 text-sm text-zinc-100 outline-none ring-cyan-400/30 focus:border-cyan-400 focus:ring-4"
              />
              <button
                id="askButton"
                type="submit"
                class="min-h-11 rounded-md bg-white px-5 text-sm font-semibold text-zinc-950 transition hover:bg-zinc-200 disabled:cursor-not-allowed disabled:opacity-60"
              >
                Ask
              </button>
            </div>
          </form>
        </section>
      </section>
    </main>

    <script>
      const loadForm = document.querySelector("#loadForm");
      const askForm = document.querySelector("#askForm");
      const messages = document.querySelector("#messages");
      const loadButton = document.querySelector("#loadButton");
      const askButton = document.querySelector("#askButton");

      const readyValue = document.querySelector("#readyValue");
      const docIdValue = document.querySelector("#docIdValue");
      const sectionsValue = document.querySelector("#sectionsValue");
      const nodesValue = document.querySelector("#nodesValue");

      function setBusy(button, busy, label) {
        button.disabled = busy;
        button.textContent = busy ? label : button.dataset.defaultLabel;
      }

      function addMessage(role, text) {
        const wrapper = document.createElement("div");
        const isUser = role === "You";
        wrapper.className = isUser ? "flex justify-end" : "flex justify-start";

        const bubble = document.createElement("div");
        bubble.className = [
          "max-w-[90%] whitespace-pre-wrap rounded-lg border p-4 text-sm leading-6",
          isUser
            ? "border-cyan-500/40 bg-cyan-400 text-zinc-950"
            : "border-zinc-800 bg-zinc-950 text-zinc-200",
        ].join(" ");
        bubble.textContent = text;

        wrapper.appendChild(bubble);
        messages.appendChild(wrapper);
        messages.scrollTop = messages.scrollHeight;
      }

      function updateStatus(status) {
        readyValue.textContent = status.ready ? "Yes" : "No";
        docIdValue.textContent = status.doc_id || "-";
        sectionsValue.textContent = status.top_level_sections ?? 0;
        nodesValue.textContent = status.total_nodes ?? 0;
      }

      async function requestJson(url, options = {}) {
        const response = await fetch(url, {
          headers: { "Content-Type": "application/json" },
          ...options,
        });

        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.detail || "Request failed.");
        }
        return data;
      }

      loadButton.dataset.defaultLabel = loadButton.textContent;
      askButton.dataset.defaultLabel = askButton.textContent;

      loadForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        setBusy(loadButton, true, "Loading...");

        const payload = {
          pdf_path: document.querySelector("#pdfPath").value.trim() || null,
          doc_id: document.querySelector("#docId").value.trim() || null,
          tree_model: document.querySelector("#treeModel").value.trim(),
        };

        try {
          const status = await requestJson("/api/load-document", {
            method: "POST",
            body: JSON.stringify(payload),
          });
          updateStatus(status);
          addMessage("System", `Document loaded.\nDoc ID: ${status.doc_id}\nNodes: ${status.total_nodes}`);
        } catch (error) {
          addMessage("System", `Load failed: ${error.message}`);
        } finally {
          setBusy(loadButton, false);
        }
      });

      askForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        const queryInput = document.querySelector("#query");
        const query = queryInput.value.trim();
        if (!query) return;

        addMessage("You", query);
        queryInput.value = "";
        setBusy(askButton, true, "Thinking...");

        try {
          const result = await requestJson("/api/ask", {
            method: "POST",
            body: JSON.stringify({ query }),
          });
          addMessage("Answer", result.answer);
        } catch (error) {
          addMessage("System", `Ask failed: ${error.message}`);
        } finally {
          setBusy(askButton, false);
        }
      });

      requestJson("/api/status")
        .then(updateStatus)
        .catch(() => {});
    </script>
  </body>
</html>
